<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login | CineWorld</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <form method="post" id="loginForm">
        {% csrf_token %}
        <h3>Welcome Back!</h3>

        {% if error %}
        <label for="error" class="error-label">{{ error }}</label>
        {% endif %}

        <label for="username">Username</label>
        <input type="text" placeholder="Enter Username" id="username" name="username" required>

        <label for="password">Password</label>
        <div class="password-container">
            <input type="password" placeholder="Enter Password" id="password" name="password" required>
            <i class="fa-solid fa-eye toggle-password" toggle="#password"></i>
        </div>

        <a class="forgot_password" href="{% url 'forgot_password' %}">Forgot Password?</a>

        <button type="submit">Login</button>

        <p class="login-footer">
            Don't have an account? <a class="span" href="{% url 'signup' %}">Create One</a>
        </p>
    </form>

    <script src="{% static 'js/login.js' %}" defer></script>
</body>
</html>
