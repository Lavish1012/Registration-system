<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up | CineWorld</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <form id="signupForm" method="post" action="">
        {% csrf_token %}
        <h3>Create Your Account</h3>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. moviebuff99" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="e.g. youremail@example.com" required>

       
        <label for="password1">Password</label>
        <div class="password-container">
            <input type="password" id="password1" name="password1" placeholder="Create Password" required>
            <i class="fa-solid fa-eye toggle-password" toggle="#password1"></i>
        </div>

        <label for="password2">Confirm Password</label>
        <div class="password-container">
            <input type="password" id="password2" name="password2" placeholder="Confirm Password" required>
            <i class="fa-solid fa-eye toggle-password" toggle="#password2"></i>
        </div>

        <button type="submit">Sign Up</button>

        <p class="login-footer">
            Already a member? <a class="span" href="{% url 'login' %}">Login Now</a>
        </p>
    </form>

    <script  src="{% static 'js/signup.js' %}" type="module" defer></script>
</body>
</html>
